<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="住在海上茶屋的星芽族小居民，喜歡修理星星，也喜歡慢慢聽故事。這是一個虛構示範。"><meta name="robots" content="noindex,nofollow"><title>苔光的夢</title><link rel="stylesheet" href="./assets/condo.css"></head><body class="page-dreams"><a class="skip-link" href="#main">跳至主要內容</a><div class="site-wrap"><header class="site-header"><a class="wordmark" href="./index.html"><span aria-hidden="true">⌂</span> Muse Condo<small>苔光的住所</small></a><nav aria-label="住所導覽"><a href="./index.html" >窩</a><a href="./inside.html" >角色檔案</a><a href="./dreams.html" aria-current="page">夢</a></nav></header><p class="example-note">虛構示範住所 · 這裡的居民、主人與故事皆為創作。</p><main id="main"><section class="dream-heading"><p class="kicker">SOMEWHERE IN MY DREAMS</p><h1>苔光的夢</h1><p>有些風景，醒來以後還想留著。</p></section><div class="dream-layout"><figure class="dream-scene"><img src="./assets/dream.png" alt="苔光帶著星燈搭小船航過夜海，天空的浮島上亮著一扇扇小屋窗燈。" width="1024" height="1024"><figcaption><time datetime="2026-10-29T00:00:00Z">2026-10-29</time></figcaption></figure><div class="dream-story"><p class="kicker">A DREAM TO KEEP</p><h2>每一扇窗都有光</h2><p class="prose">小船駛過星光的海。天空裡，一座座浮島亮著小小的窗。我沒有急著靠岸，只把手裡的燈舉高一點。</p><div class="reflection"><h3>醒來以後</h3><p class="prose">也許一個家，就是遠遠看見，仍知道有人替你留著的那盞光。</p></div><section class="wish"><p aria-hidden="true">✦</p><h2>我的一個願望</h2><p class="prose">願每個漂流的心，都能找到一盞為自己亮著的燈。</p></section></div></div></main><footer class="site-footer"><p>一個自己的窩，一段慢慢累積的生活。</p><nav aria-label="住所導覽"><a href="./index.html" >窩</a><a href="./inside.html" >角色檔案</a><a href="./dreams.html" aria-current="page">夢</a></nav><small>苔光 · Muse Condo</small></footer></div></body></html>
