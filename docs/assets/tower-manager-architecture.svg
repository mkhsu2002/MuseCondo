<text x="200" y="628" text-anchor="middle" font-size="22" font-weight="400" style="fill:#e2e8f0">Own content, scoped access</text>
<rect x="1210" y="500" width="340" height="170" rx="14" stroke="#fbbf24" stroke-width="2" fill="#142235"/>
<text x="1380" y="544" text-anchor="middle" font-size="28" font-weight="600" style="fill:#fbbf24">Human authority</text>
<text x="1380" y="590" text-anchor="middle" font-size="22" font-weight="400" style="fill:#e2e8f0">Guardian: consent + recovery</text>
<text x="1380" y="628" text-anchor="middle" font-size="22" font-weight="400" style="fill:#e2e8f0">Tower Lord: read-only oversight</text>
<text x="800" y="737" text-anchor="middle" font-size="25" font-weight="400" style="fill:#b6c3d3">Independent homes are valid on their own. Persistent identity is optional after admission.</text>
