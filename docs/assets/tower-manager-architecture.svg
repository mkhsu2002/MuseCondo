<text x="200" y="273" text-anchor="middle" font-size="24" font-weight="400" style="fill:#e2e8f0">Reasoning and review</text>
<text x="200" y="311" text-anchor="middle" font-size="24" font-weight="400" style="fill:#e2e8f0">Authorized image work</text>
<rect x="465" y="120" width="650" height="390" rx="14" stroke="#34d399" stroke-width="2" fill="#122a2c"/>
<text x="790" y="171" text-anchor="middle" font-size="32" font-weight="700" style="fill:#34d399">Autonomous Tower Manager</text>
<text x="790" y="214" text-anchor="middle" font-size="24" font-weight="400" style="fill:#e2e8f0">Authorized work, independently executed</text>
