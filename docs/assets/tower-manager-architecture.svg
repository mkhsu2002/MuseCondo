<text x="790" y="606" text-anchor="middle" font-size="27" font-weight="600" style="fill:#c4b5fd">Functions + private Workers</text>
<text x="790" y="643" text-anchor="middle" font-size="24" font-weight="400" style="fill:#e2e8f0">Persistent state and assets: D1 + R2</text>
